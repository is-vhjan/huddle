name: Publish

on:
  push:
    branches: [main, release/*]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./gateway
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/infosupport/huddle:latest

  base-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base-devimage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: base-devimage/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/infosupport/base-devimage:latest

      - name: Build and push base-devimage-vscode
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: base-devimage-vscode/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/infosupport/base-devimage-vscode:latest

      - name: Build and push base-devimage-intellij
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: base-devimage-intellij/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/infosupport/base-devimage-intellij:latest

      - name: Build and push base-devimage-rider
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: base-devimage-rider/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/infosupport/base-devimage-rider:latest

  # De npm-publish van de CLI leeft in publish-npm.yml: npm trusted publishing
  # staat maar één trusted publisher (workflow-bestand) per package toe.
